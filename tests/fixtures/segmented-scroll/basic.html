<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Segmented Scroll — standalone fixture</title>
  <link rel="stylesheet" href="/package/styles.css">
  <style>
    html { scroll-snap-type: y mandatory; }
    body { margin: 0; font-family: sans-serif; }
    section { scroll-snap-align: start; height: 100vh; display: grid; place-items: center; }
    #first { background: #eee; } #second { background: #cdf; } #third { background: #dfc; }
    nav { position: fixed; top: 16px; left: 16px; }
    [aria-current="true"] { outline: 2px solid blue; }
  </style>
  <script type="importmap">{"imports":{"@masahi-desu/segmented-scroll":"/package/index.js"}}</script>
</head>
<body>
  <nav aria-label="Sections"><button data-target="first">1</button><button data-target="second">2</button><button data-target="third">3</button></nav>
  <section id="first"><h1>First</h1></section>
  <section id="second"><h2>Second</h2></section>
  <section id="third"><h2>Third</h2></section>
  <script type="module">
    import { createScrollController, createSegmentView } from '@masahi-desu/segmented-scroll';
    const navigation = createScrollController({
      getStops: () => [...document.querySelectorAll('section')].map(element => ({ id: element.id, element }))
    });
    const view = createSegmentView({
      track: document.querySelector('nav'),
      controls: document.querySelectorAll('button'),
      getTargetId: button => button.dataset.target
    });
    view.connect(navigation);
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', () => navigation.goTo(button.dataset.target));
    });
    // The fixture exposes diagnostics only; production hosts can subscribe directly.
    window.events = [];
    navigation.subscribe(event => window.events.push(event));
    navigation.mount();
    window.navigationController = navigation;
  </script>
</body>
</html>
